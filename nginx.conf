server {
    # 8095 rather than nginx-unprivileged's default 8080, so the port is the
    # same inside the container and on the host.
    listen 8095;
    listen [::]:8095;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Note: do not add a `types` block here. It replaces the inherited mime map
    # rather than extending it, and mime.types cannot be re-included inside one
    # because it is already wrapped in its own types block. The bundled map
    # covers .wasm, which sql.js requires; .db is handled per-location below.

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        image/svg+xml
        application/wasm
        application/vnd.sqlite3;

    # Vue Router uses createWebHistory, so deep links like /battle-tracker are
    # real URLs the server must answer with the shell.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite fingerprints these filenames, so they can never go stale.
    location /assets/ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The monster database is ~1.9 MB and changes only on redeploy. Revalidate
    # so a new image is picked up, but let ETags spare the transfer. .db has no
    # entry in mime.types, so default_type names it here — which also gives
    # gzip_types something to match, halving the download.
    location /data/ {
        default_type application/vnd.sqlite3;
        add_header Cache-Control "public, no-cache";
    }

    # The shell references the hashed bundles, so it must never be cached or the
    # browser will keep loading a deleted build.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
